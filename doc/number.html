<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>数字背景动画-jq22.com</title>
<script src="https://www.jq22.com/jquery/jquery-1.10.2.js"></script>
<style>
* {
	margin:0;
	padding:0;
}
html,body {
	width:100%;
	height:100%;
	overflow:hidden;
	background:black;
}
canvas {
	display:block;
}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<div id="controls"></div>

<script>
function setup (){
  pixelDensity(1);
  createCanvas();
  colorMode(HSB, 1, 1, 1);
  windowResized();
}

let gw, gh;
let c1, offset;
let updatesPerFrame;
let xSpan = 15;
let ySpan = xSpan*1.5;
let init = () => {
  gw = floor(width/xSpan)+1;
  gh = floor(height/ySpan)+1;
  updatesPerFrame = gw*gh*.025;
  c1 = createGraphics(gw*xSpan, gh*ySpan);
  c1.colorMode(HSB, 1, 1, 1);
  c1.textAlign(LEFT, TOP);
  c1.background(0);
  c1.textSize(xSpan*1.5);
  offset = 0;
}

function draw(){
  background(0);
  offset += 1;
  c1.noStroke();
  for (let i = 0; i < updatesPerFrame; i++){
    let x = floor(random(gw));
    let y = floor(random(gh));
    c1.fill(0);
    c1.rect(x*xSpan, y*ySpan, xSpan, ySpan);
    c1.fill(.33 + random(-.1, .1), random(), random(.5, 1));
    c1.text(floor(random(2)), x*xSpan, y*ySpan);
  }
  for (let i = 0; i < height; i++){
    let w = i;
    image(c1, -w/2, i, width+w, 1, 0, (i+offset)%(gh*ySpan), gw*xSpan, 1);
  }
}

function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  init();
}</script>

</body>
</html>
